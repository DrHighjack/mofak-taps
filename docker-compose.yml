services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://streamclock:${DB_PASSWORD}@db:5432/streamclock
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      APP_TZ: ${APP_TZ:-America/Los_Angeles}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - default
      - proxy
    volumes:
      - ./secrets:/srv/secrets:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: streamclock
      POSTGRES_USER: streamclock
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamclock -d streamclock"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: db
      PGUSER: streamclock
      PGDATABASE: streamclock
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_DIR: /backups
    volumes:
      - type: bind
        source: ${BACKUP_DIR:-./backups}
        target: /backups
        bind:
          create_host_path: false
      - type: bind
        source: ./backup.sh
        target: /usr/local/bin/streamclock-backup
        read_only: true
    entrypoint: ["/bin/sh", "/usr/local/bin/streamclock-backup", "--schedule"]
    depends_on:
      db:
        condition: service_healthy
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    networks:
      proxy:
        ipv4_address: ${TUNNEL_PROXY_IP:-172.30.0.2}
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      app:
        condition: service_started
volumes:
  pgdata:
networks:
  proxy:
    ipam:
      config:
        - subnet: ${TUNNEL_PROXY_SUBNET:-172.30.0.0/24}
